<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tiny Museum</title>
<meta name="description" content="A daily art quiz. Ten famous artworks. Guess, then get the story.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --wall: #f4f1ea; --ink: #1d1c1a; --muted: #6f6a61; --card: #fffdf8; --line: #e2dccf;
    --frame: #2b2520; --gold: #b08d4f; --right: #2f7d4f; --wrong: #b8412f; --chip: #ece7dc;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --wall: #17161a; --ink: #eeebe4; --muted: #a39d92; --card: #211f24; --line: #34313a;
      --frame: #0d0c0e; --chip: #2a2830; --right: #56b27c; --wrong: #e07260;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--wall); color: var(--ink); font: 16px/1.55 Inter, system-ui, sans-serif; }
  button { font: inherit; cursor: pointer; color: inherit; }
  .hidden { display: none !important; }
  .wrap { max-width: 1000px; margin: 0 auto; padding: 22px 16px 48px; }
  .serif { font-family: "Cormorant Garamond", Georgia, serif; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .logo { font-family: "Cormorant Garamond", Georgia, serif; font-size: 30px; font-weight: 700; letter-spacing: .01em; text-decoration: none; color: var(--ink); }
  .logo small { font-family: Inter, sans-serif; font-size: 12px; font-weight: 500; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; margin-left: 8px; }
  .hud { display: flex; gap: 14px; font-size: 14px; color: var(--muted); align-items: center; }
  .dots { display: flex; gap: 4px; }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
  .dots i.r { background: var(--right); } .dots i.w { background: var(--wrong); } .dots i.now { outline: 2px solid var(--gold); outline-offset: 1px; }

  /* Lobby */
  .lobby { text-align: center; padding: 40px 0 10px; }
  .lobby h1 { font-family: "Cormorant Garamond", Georgia, serif; font-size: clamp(46px, 9vw, 84px); line-height: .95; margin: 0 0 14px; font-weight: 700; }
  .lobby h1 em { color: var(--gold); }
  .lobby p { color: var(--muted); font-size: 18px; max-width: 520px; margin: 0 auto 26px; }
  .cta { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn { padding: 13px 22px; border-radius: 999px; border: 1px solid var(--ink); background: var(--ink); color: var(--wall); font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--ink); }
  .btn:disabled { opacity: .5; cursor: default; }
  .teaser { display: flex; justify-content: center; gap: 14px; margin: 34px 0 10px; }
  .teaser img { width: 88px; height: 110px; object-fit: cover; border: 6px solid var(--frame); box-shadow: 0 8px 18px rgba(0,0,0,.18); background: var(--chip); }
  .teaser img:nth-child(odd) { transform: rotate(-3deg); } .teaser img:nth-child(even) { transform: rotate(2deg) translateY(6px); }
  .today { margin-top: 18px; font-size: 14px; color: var(--muted); }

  /* Play */
  .stage { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  @media (max-width: 800px) { .stage { grid-template-columns: 1fr; gap: 18px; } }
  .wall { display: grid; place-items: center; min-height: 380px; padding: 12px; position: relative; }
  .wall::before { content: ""; position: absolute; left: 10%; right: 10%; top: 0; height: 60%; background: radial-gradient(ellipse at 50% 0%, rgba(255,240,200,.55), transparent 70%); pointer-events: none; }
  .frame { position: relative; padding: 14px; background: var(--frame); box-shadow: 0 18px 40px rgba(0,0,0,.28), inset 0 0 0 2px rgba(176,141,79,.5); max-width: 100%; }
  .frame img { display: block; max-width: 100%; max-height: 62vh; background: #ddd; transition: opacity .35s ease; }
  .frame img.loading { opacity: 0; }
  @media (max-width: 800px) { .frame img { max-height: 46vh; } }

  .label { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 20px 20px 18px; box-shadow: 0 6px 18px rgba(0,0,0,.06); }
  .qnum { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .q { font-family: "Cormorant Garamond", Georgia, serif; font-size: 32px; font-weight: 700; line-height: 1.1; margin: 4px 0 14px; }
  .opts { display: grid; gap: 8px; }
  .opt { text-align: left; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--wall); font-weight: 500; transition: transform .08s ease, border-color .15s ease; }
  .opt:hover:not(:disabled) { border-color: var(--ink); transform: translateX(2px); }
  .opt:disabled { cursor: default; }
  .opt.right { border-color: var(--right); background: color-mix(in srgb, var(--right) 14%, var(--card)); }
  .opt.wrong { border-color: var(--wrong); background: color-mix(in srgb, var(--wrong) 12%, var(--card)); }
  .opt.dim { opacity: .5; }
  .opt .mark { float: right; font-weight: 700; }

  .reveal { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 14px; animation: rise .35s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  .verdict { font-weight: 600; margin-bottom: 8px; }
  .verdict.r { color: var(--right); } .verdict.w { color: var(--wrong); }
  .ttl { font-family: "Cormorant Garamond", Georgia, serif; font-size: 22px; font-style: italic; font-weight: 700; line-height: 1.2; }
  .meta { font-size: 14px; color: var(--muted); margin: 2px 0 10px; }
  .note { font-size: 16px; margin: 0 0 12px; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .met { font-size: 13px; color: var(--muted); }

  /* Results */
  .results { text-align: center; padding: 26px 0; }
  .results .score { font-family: "Cormorant Garamond", Georgia, serif; font-size: 88px; font-weight: 700; line-height: 1; }
  .results .rank { font-family: "Cormorant Garamond", Georgia, serif; font-size: 30px; font-style: italic; margin: 6px 0 4px; }
  .results .quip { color: var(--muted); margin: 0 0 18px; }
  .grid { font-size: 26px; letter-spacing: 4px; margin-bottom: 20px; }
  .thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; max-width: 560px; margin: 24px auto 0; }
  .thumbs a { display: block; position: relative; aspect-ratio: 4/5; border: 4px solid var(--frame); background: var(--chip); }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumbs span { position: absolute; right: -6px; top: -6px; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; font-weight: 700; color: #fff; display: grid; place-items: center; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--wall); padding: 10px 16px; border-radius: 999px; font-size: 14px; }
  footer { margin-top: 40px; text-align: center; font-size: 13px; color: var(--muted); }
  footer a { color: var(--ink); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="logo" href="./" id="home">Tiny Museum<small>an art quiz</small></a>
    <div class="hud hidden" id="hud"><span id="modeLbl"></span><div class="dots" id="dots"></div></div>
  </header>

  <!-- Lobby -->
  <section class="lobby" id="lobby">
    <h1>Know your <em>art?</em></h1>
    <p>Ten famous artworks. Guess who made it, where it's from, or when. Then get the story, short and sweet.</p>
    <div class="cta">
      <button class="btn" id="playDaily">Play today's 10</button>
      <button class="btn ghost" id="playEndless">Practice: endless</button>
    </div>
    <div class="teaser" id="teaser"></div>
    <div class="today" id="today"></div>
  </section>

  <!-- Play -->
  <section class="stage hidden" id="stage">
    <div class="wall"><div class="frame"><img id="art" alt=""></div></div>
    <div class="label">
      <div class="qnum" id="qnum"></div>
      <div class="q" id="q"></div>
      <div class="opts" id="opts"></div>
      <div class="reveal hidden" id="reveal">
        <div class="verdict" id="verdict"></div>
        <div class="ttl" id="ttl"></div>
        <div class="meta" id="meta"></div>
        <p class="note" id="note"></p>
        <div class="row"><a class="met" id="metLink" target="_blank" rel="noopener"></a><button class="btn" id="next">Next</button></div>
      </div>
    </div>
  </section>

  <!-- Results -->
  <section class="results hidden" id="results">
    <div class="score" id="rScore"></div>
    <div class="rank" id="rRank"></div>
    <p class="quip" id="rQuip"></p>
    <div class="grid" id="rGrid"></div>
    <div class="cta"><button class="btn" id="share">Copy my score</button><button class="btn ghost" id="practice">Keep playing: endless</button></div>
    <div class="thumbs" id="rThumbs"></div>
  </section>

  <footer>Artworks and images: <a href="https://www.artic.edu/open-access/open-access-images">Art Institute of Chicago</a> open access (CC0). Notes are AI-written. · <a href="https://github.com/sam0/tiny-museum">Code</a> · <a href="https://sam0.github.io/">More projects</a></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem('tm.' + k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tm.' + k, JSON.stringify(v)); } catch {} }
};

const RANKS = [
  [0, 'Gift Shop Regular', 'You came for the tote bag. Respect.'],
  [3, 'Audio Guide Enthusiast', 'You press the numbers. You learn things. Growth.'],
  [5, 'Member Since Last Tuesday', "Solid. You're starting to have opinions about frames."],
  [7, 'Docent in Training', 'You could lead a tour. A short one.'],
  [9, "Night Guard Who's Seen Things", 'The paintings talk to you after hours.'],
  [10, 'Chief Curator', 'Perfect. The Met would like a word.']
];
const rankFor = (s) => RANKS.filter((r) => s >= r[0]).pop();

// Deterministic daily pick: everyone gets the same 10 on the same day
const todayKey = () => new Date().toLocaleDateString('en-CA');
function seeded(seedStr) {
  let h = 2166136261;
  for (const c of seedStr) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => { h = Math.imul(h ^ (h >>> 15), 2246822507); h = Math.imul(h ^ (h >>> 13), 3266489909); return ((h ^= h >>> 16) >>> 0) / 4294967296; };
}
function pickDaily(items, day) {
  const rnd = seeded('tiny-museum:' + day);
  const byQ = {};
  for (const it of items) (byQ[it.q] ||= []).push(it);
  const wantArtist = 6;
  const take = (arr, n) => { const a = [...arr]; const out = []; while (out.length < n && a.length) out.push(a.splice(Math.floor(rnd() * a.length), 1)[0]); return out; };
  const artist = take(byQ['Who made this?'] || [], wantArtist);
  const others = take(items.filter((i) => i.q !== 'Who made this?'), 10 - artist.length);
  const ten = [...artist, ...others];
  for (let i = ten.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [ten[i], ten[j]] = [ten[j], ten[i]]; }
  // Options order is fixed per day too
  return ten.map((it) => ({ ...it, opts: [...it.opts].sort(() => rnd() - 0.5) }));
}

let DATA, deck = [], idx = 0, answers = [], mode = 'daily';

fetch('quiz.json').then((r) => r.json()).then((d) => {
  DATA = d.items;
  const daily = pickDaily(DATA, todayKey());
  $('teaser').innerHTML = daily.slice(0, 5).map((it) => `<img src="${esc(it.img)}" alt="" loading="lazy">`).join('');
  const done = store.get('daily', {})[todayKey()];
  if (done) {
    $('playDaily').textContent = `Today: ${done.score}/10 · see results`;
  }
  const streak = store.get('streak', { n: 0 });
  $('today').textContent = `${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}` + (streak.n > 1 ? ` · ${streak.n}-day streak` : '');
});

$('playDaily').addEventListener('click', () => {
  const done = store.get('daily', {})[todayKey()];
  mode = 'daily';
  deck = pickDaily(DATA, todayKey());
  if (done) { answers = done.answers; return showResults(); }
  start();
});
$('playEndless').addEventListener('click', startEndless);
$('practice').addEventListener('click', startEndless);

function startEndless() {
  mode = 'endless';
  deck = [...DATA].sort(() => Math.random() - 0.5).map((it) => ({ ...it, opts: [...it.opts].sort(() => Math.random() - 0.5) }));
  start();
}

function start() {
  idx = 0; answers = [];
  show('stage'); $('hud').classList.remove('hidden');
  render();
}

function show(id) {
  for (const s of ['lobby', 'stage', 'results']) $(s).classList.toggle('hidden', s !== id);
  window.scrollTo(0, 0);
}

function renderHud() {
  if (mode === 'daily') {
    $('modeLbl').textContent = "Today's 10";
    $('dots').innerHTML = deck.map((_, i) => `<i class="${answers[i] === true ? 'r' : answers[i] === false ? 'w' : i === idx ? 'now' : ''}"></i>`).join('');
  } else {
    const right = answers.filter(Boolean).length;
    $('modeLbl').textContent = `Endless · ${right}/${answers.length}`;
    $('dots').innerHTML = '';
  }
}

function render() {
  const it = deck[idx];
  renderHud();
  const img = $('art');
  img.classList.add('loading');
  img.onload = () => img.classList.remove('loading');
  img.src = it.img;
  img.alt = 'Artwork to identify';
  if (deck[idx + 1]) new Image().src = deck[idx + 1].img;   // preload the next one
  $('qnum').textContent = mode === 'daily' ? `Artwork ${idx + 1} of ${deck.length}` : `Artwork ${idx + 1}`;
  $('q').textContent = it.q;
  $('opts').innerHTML = it.opts.map((o) => `<button class="opt" data-v="${esc(o)}">${esc(o)}</button>`).join('');
  $('reveal').classList.add('hidden');
}

$('opts').addEventListener('click', (e) => {
  const b = e.target.closest('.opt'); if (!b || b.disabled) return;
  const it = deck[idx];
  const ok = b.dataset.v === it.a;
  answers[idx] = ok;
  for (const o of $('opts').children) {
    o.disabled = true;
    if (o.dataset.v === it.a) { o.classList.add('right'); o.insertAdjacentHTML('beforeend', '<span class="mark">✓</span>'); }
    else if (o === b) { o.classList.add('wrong'); o.insertAdjacentHTML('beforeend', '<span class="mark">✕</span>'); }
    else o.classList.add('dim');
  }
  $('verdict').className = 'verdict ' + (ok ? 'r' : 'w');
  $('verdict').textContent = ok ? pickLine(['Nailed it.', 'Correct. Very cultured.', 'Yes! Someone paid attention.', 'Right. Take a bow.']) : `Nope. It's ${it.a}.`;
  $('ttl').textContent = it.t;
  $('meta').textContent = [it.by, it.d, it.place].filter(Boolean).join(' · ');
  $('note').textContent = it.note;
  $('metLink').href = it.url;
  $('metLink').textContent = `See it at the ${it.museum.replace(/^The /, '')} ↗`;
  $('next').textContent = mode === 'daily' && idx === deck.length - 1 ? 'See my score' : 'Next';
  $('reveal').classList.remove('hidden');
  renderHud();
  if (window.innerWidth < 800) $('reveal').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
});
const pickLine = (a) => a[Math.floor(Math.random() * a.length)];

$('next').addEventListener('click', () => {
  if (mode === 'daily' && idx === deck.length - 1) {
    const score = answers.filter(Boolean).length;
    const all = store.get('daily', {});
    all[todayKey()] = { score, answers };
    store.set('daily', all);
    const s = store.get('streak', { n: 0, last: null });
    const y = new Date(Date.now() - 864e5).toLocaleDateString('en-CA');
    store.set('streak', { n: s.last === y ? s.n + 1 : s.last === todayKey() ? s.n : 1, last: todayKey() });
    return showResults();
  }
  idx++;
  if (idx >= deck.length) { idx = 0; }
  render();
});

function showResults() {
  const score = answers.filter(Boolean).length;
  const [, rank, quip] = rankFor(score);
  $('hud').classList.add('hidden');
  $('rScore').textContent = `${score}/10`;
  $('rRank').textContent = rank;
  $('rQuip').textContent = quip;
  $('rGrid').textContent = answers.map((a) => (a ? '🟩' : '🟥')).join('');
  $('rThumbs').innerHTML = deck.map((it, i) => `<a href="${esc(it.url)}" target="_blank" rel="noopener" title="${esc(it.t)}"><img src="${esc(it.img)}" alt="${esc(it.t)}" loading="lazy"><span style="background:var(--${answers[i] ? 'right' : 'wrong'})">${answers[i] ? '✓' : '✕'}</span></a>`).join('');
  show('results');
}

$('share').addEventListener('click', async () => {
  const score = answers.filter(Boolean).length;
  const text = `Tiny Museum · ${new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}\n${score}/10, ${rankFor(score)[1]}\n${answers.map((a) => (a ? '🟩' : '🟥')).join('')}\n${location.origin}${location.pathname}`;
  try { await navigator.clipboard.writeText(text); toast('Copied. Go brag.'); } catch { toast('Could not copy. Screenshot it!'); }
});
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 1800);
}
</script>
</body>
</html>
